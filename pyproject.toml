[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsamp-processor"
version = "0.1.0"
description = "FSAMP Processor - Event-driven file processor with FIPS 140-3 compliance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Pauszek", email = "pauszek@github.io" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # AWS SDK
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    
    # AWS Lambda Powertools (logging, tracing, metrics, batch)
    "aws-lambda-powertools[tracer,aws-sdk]>=3.3.0",
    
    # Validation & Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # Cryptography (FIPS 140-3 compliant)
    "cryptography>=43.0.0",
    
    # Observability
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    
    # Utilities
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "moto[all]>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "pre-commit>=4.0.0",
    "types-python-dateutil>=2.9.0",
    "boto3-stubs[s3,sqs,dynamodb,kms]>=1.35.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "moto[all]>=5.0.0",
    "localstack-client>=2.6.0",
    # Contract testing
    "jsonschema>=4.23.0",
]

[project.scripts]
fsamp-processor = "processor.main:main"

[project.entry-points."aws_lambda"]
handler = "processor.lambda_handler:lambda_handler"

[project.urls]
Homepage = "https://github.com/pauszek/fsamp-processor"
Documentation = "https://github.com/pauszek/fsamp-processor#readme"
Repository = "https://github.com/pauszek/fsamp-processor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# =============================================================================
# Ruff (Linter + Formatter)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "N",      # pep8-naming
    "RUF",    # Ruff-specific
]
ignore = [
    "S101",   # Allow assert in tests
    "B008",   # Allow function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["processor"]

# =============================================================================
# Black (Formatter)
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

# =============================================================================
# MyPy (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with LocalStack",
    "e2e: End-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["src/processor"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
