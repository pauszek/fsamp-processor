[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsamp-processor"
version = "0.1.0"
description = "FSAMP Processor - Event-driven file processor with FIPS 140-3 compliance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Pauszek", email = "pauszek@github.io" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # AWS SDK
    "boto3>=1.42.0",
    "botocore>=1.42.0",

    # Force urllib3 upgrade (CVE-2025-66418, CVE-2025-66471)
    "urllib3>=2.6.0",

    # AWS Lambda Powertools (logging, tracing, metrics, batch)
    "aws-lambda-powertools[tracer,aws-sdk]>=3.23.0",

    # Validation & Settings
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",

    # Cryptography (FIPS 140-3 compliant)
    "cryptography>=46.0.0",

    # Observability
    "structlog>=25.5.0",
    "python-json-logger>=4.0.0",

    # Utilities
    "tenacity>=9.1.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.0",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "moto[all]>=5.1.0",
    "mypy>=1.16.0",
    "ruff>=0.14.0",
    "pre-commit>=4.2.0",
    "types-python-dateutil>=2.9.0",
    "boto3-stubs[s3,sqs,dynamodb,kms]>=1.42.0",
]
test = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.0",
    "pytest-mock>=3.15.0",
    "moto[all]>=5.1.0",
    "localstack-client>=2.8.0",
    # Contract testing
    "jsonschema>=4.25.0",
]

[project.scripts]
fsamp-processor = "processor.main:main"

[project.entry-points."aws_lambda"]
handler = "processor.lambda_handler:lambda_handler"

[project.urls]
Homepage = "https://github.com/pauszek/fsamp-processor"
Documentation = "https://github.com/pauszek/fsamp-processor#readme"
Repository = "https://github.com/pauszek/fsamp-processor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# =============================================================================
# Ruff (Linter + Formatter)
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "N",      # pep8-naming
    "RUF",    # Ruff-specific
]
ignore = [
    "S101",   # Allow assert in tests
    "B008",   # Allow function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",   # Allow assert
    "S105",   # Allow hardcoded passwords (fake AWS creds for moto)
    "S106",   # Allow hardcoded passwords in arguments (LocalStack creds)
    "S110",   # Allow try-except-pass (expected failures in tests)
    "ARG001", # Allow unused arguments (fixtures)
    "ARG002", # Allow unused method arguments (mocks)
    "B007",   # Allow unused loop variables
    "B017",   # Allow blind exceptions
    "SIM105", # Allow try-except-pass instead of contextlib.suppress
    "F841",   # Allow unused variables (mock assertions)
    "E501",   # Allow long lines (SHA256 checksums)
]
"src/processor/adapters/outbound/kms_crypto.py" = ["ARG002", "B905"]  # test crypto provider
"src/processor/adapters/outbound/outbox_repo.py" = ["E501"]  # long DynamoDB expressions
"src/processor/infrastructure/aws_clients.py" = ["B019"]  # lru_cache on singleton factory methods is intentional
"src/processor/infrastructure/logging.py" = ["RUF005"]  # list concatenation is clearer here
"src/processor/outbox_publisher.py" = ["ARG001"]  # Lambda handler signature requires event/context

[tool.ruff.lint.isort]
known-first-party = ["processor"]

# =============================================================================
# Black (Formatter)
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

# =============================================================================
# MyPy (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with LocalStack",
    "e2e: End-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["src/processor"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "infrastructure", ".venv"]
