# =============================================================================
# FSAMP Processor - Docker Compose for Local Development
# =============================================================================
# Runs the processor alongside LocalStack for local testing.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FSAMP Processor Service
  # ---------------------------------------------------------------------------
  processor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fsamp-processor
    restart: unless-stopped
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      # Environment
      - ENVIRONMENT=local
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=console
      
      # AWS Configuration (LocalStack)
      - AWS_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      
      # Resource ARNs/URLs (must match Terraform outputs)
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/fsamp-local-processing-queue
      - SNS_TOPIC_ARN=arn:aws:sns:us-west-2:000000000000:fsamp-local-file-events
      - S3_BUCKET_NAME=fsamp-local-files
      - DYNAMODB_TABLE_NAME=fsamp-local-metadata
      - KMS_KEY_ID=alias/fsamp-local-master-key
      
      # Processing settings
      - SQS_MAX_MESSAGES=10
      - SQS_WAIT_TIME_SECONDS=20
      - SQS_VISIBILITY_TIMEOUT=300
    networks:
      - fsamp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import processor; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # LocalStack (AWS emulator)
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack-pro:4.0
    container_name: fsamp-processor-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - AWS_DEFAULT_REGION=us-west-2
      - SERVICES=s3,sqs,sns,dynamodb,kms,iam,sts
      - EAGER_SERVICE_LOADING=1
      - ENFORCE_IAM=1
      - IAM_SOFT_MODE=1
      - PERSISTENCE=1
      - DEBUG=0
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fsamp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  localstack-data:
    name: fsamp-processor-localstack-data

networks:
  fsamp-network:
    driver: bridge
    name: fsamp-network
    external: true  # Connect to existing network from fsamp-infra
