# Pytest Configuration for FSAMP Processor
#
# Run different test types:
#   pytest                           # All tests (except integration)
#   pytest -m unit                   # Only unit tests
#   pytest -m integration            # Only integration tests (requires Docker)
#   pytest -m "not integration"      # All except integration
#

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Default: exclude integration tests (require Docker)
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    -m "not integration"

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests with LocalStack (require Docker)
    e2e: End-to-end tests
    slow: Slow tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
