name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  call-python:
    uses: pauszek/fsamp-code-ci/.github/workflows/build-python.yml@v0.0.38
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
