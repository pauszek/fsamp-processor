name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  params:
    name: Load Deployment Settings
    runs-on: ubuntu-latest
    outputs:
      auto_deploy_dev: ${{ steps.params.outputs.auto_deploy_dev }}
    steps:
      - uses: actions/checkout@v5

      - name: Load params
        id: params
        shell: bash
        run: |
          auto_deploy_dev="$(python3 - <<'PY'
          from pathlib import Path

          value = "false"
          section = None

          for raw in Path(".github/params.yml").read_text().splitlines():
              line = raw.split("#", 1)[0].rstrip()
              if not line.strip():
                  continue
              if not line.startswith((" ", "\t")) and line.endswith(":"):
                  section = line[:-1].strip()
                  continue
              if section == "deploy":
                  stripped = line.strip()
                  if stripped.startswith("auto-dev:"):
                      value = stripped.split(":", 1)[1].strip().strip("'\"").lower()
                      break

          print("true" if value == "true" else "false")
          PY
          )"
          echo "auto_deploy_dev=${auto_deploy_dev}" >> "$GITHUB_OUTPUT"

  call-python:
    uses: pauszek/fsamp-code-ci/.github/workflows/build-python.yml@v0.0.52
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  deploy-dev:
    name: Trigger Dev Deploy
    needs:
      - call-python
      - params
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.call-python.result == 'success' &&
      needs.params.outputs.auto_deploy_dev == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra

      - name: Dispatch dev deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          version="0.0.0"
          [[ -s release.version ]] && version="$(tr -d ' \r\n' < release.version)"
          image_tag="dev-fsamp-processor-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"

          jq -n \
            --arg gateway_ref "main" \
            --arg processor_ref "${GITHUB_SHA}" \
            --arg image_tag "${image_tag}" \
            --arg service "fsamp-processor" \
            --arg version "${version}" \
            '{
              event_type: "deploy-dev",
              client_payload: {
                gateway_ref: $gateway_ref,
                processor_ref: $processor_ref,
                image_tag: $image_tag,
                service: $service,
                version: $version
              }
            }' \
            | gh api "repos/${OWNER}/fsamp-infra/dispatches" --method POST --input -
