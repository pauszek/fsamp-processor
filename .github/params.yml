# =============================================================================
# CI/CD Parameters for fsamp-processor
# =============================================================================
# Configuration used by reusable workflows from fsamp-code-ci

ci:
  python-version: "3.14"

files:
  version: release.version

qodana:
  enabled: false

bump:
  enabled: true
  base-branch: main
  label: autobump

release:
  full-release: true
  publish: true

docker:
  enabled: true
  image-name: fsamp-processor
  dockerfile: Dockerfile.lambda
  registry: ghcr.io

sonar:
  enabled: true
  organization: pauszek
  project-key: pauszek_fsamp-processor
